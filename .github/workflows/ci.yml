name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the RISC-V build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils-riscv64-unknown-elf \
            clang-tidy \
            gcc-riscv64-unknown-elf \
            opensbi \
            qemu-system-misc

      - name: Build and verify from scratch
        run: make PREFIX=riscv64-unknown-elf- verify
